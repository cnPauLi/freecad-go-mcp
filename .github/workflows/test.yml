name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

      # The addon is vendored so the repository is self-contained; make sure it
      # stays syntactically valid even though it is not part of the Go build.
      - name: Check the bundled addon
        run: python3 -m compileall -q addon

  mcp-go-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mcp-requirement:
          - "github.com/mark3labs/mcp-go@v1.1.0"
          - "github.com/mark3labs/mcp-go@latest"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build against ${{ matrix.mcp-requirement }}
        run: |
          go get "${{ matrix.mcp-requirement }}"
          go build ./...
          go test ./...